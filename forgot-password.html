<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - TechSphere</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <a href="index.html" class="brand-wrapper">
            <div class="brand-icon">⚡</div>
            <h1>TechSphere</h1>
        </a>

        <button class="menu-toggle" id="menuToggle" aria-label="Toggle Navigation">☰</button>

        <nav id="navMenu">
            <a href="index.html">Home</a>
            <a href="login.html">Login</a>
            <a href="register.html" class="nav-cta">Register</a>
        </nav>
    </header>

    <main style="flex: 1; display: flex; align-items: center; justify-content: center; padding: 40px 20px;">
        <div class="login-container auth-card">

            <div class="brand-icon" style="margin: 0 auto 16px; width: 44px; height: 44px; font-size: 24px;">🔑</div>
            <h2>Forgot Password?</h2>
            <p>Enter your registered email address and we will send you a password reset link.</p>

            <form id="forgotPasswordForm" novalidate>

                <label for="forgotEmail">Email Address</label>
                <input type="email" id="forgotEmail" placeholder="name@example.com" required autocomplete="email">

                <button type="submit" id="sendResetBtn" class="btn btn-primary">Send Reset Link</button>

            </form>

            <div id="forgotMessage" role="status" style="display: none; margin-top: 16px; padding: 12px 14px; border-radius: 8px; font-size: 14px; text-align: left;"></div>

            <div class="auth-footer">
                <p>Remembered your password? <a href="login.html">Back to Login</a></p>
            </div>

        </div>
    </main>

    <!-- Footer -->
    <footer>
        <div class="footer-bottom">
            <p>© 2026 TechSphere. All Rights Reserved.</p>
            <p>Empowering Tech Creators Worldwide</p>
        </div>
    </footer>

    <script src="script.js"></script>

</body>
</html>
