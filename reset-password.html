<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - TechSphere</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <a href="index.html" class="brand-wrapper">
            <div class="brand-icon">⚡</div>
            <h1>TechSphere</h1>
        </a>

        <button class="menu-toggle" id="menuToggle" aria-label="Toggle Navigation">☰</button>

        <nav id="navMenu">
            <a href="index.html">Home</a>
            <a href="login.html">Login</a>
            <a href="register.html" class="nav-cta">Register</a>
        </nav>
    </header>

    <main style="flex: 1; display: flex; align-items: center; justify-content: center; padding: 40px 20px;">
        <div class="login-container auth-card">

            <div class="brand-icon" style="margin: 0 auto 16px; width: 44px; height: 44px; font-size: 24px;">🔒</div>
            <h2>Reset Your Password</h2>
            <p>Choose a strong new password for your TechSphere account.</p>

            <div id="resetTokenStatus" style="margin-bottom: 16px; font-size: 14px; color: var(--text-muted);">
                Verifying your reset link...
            </div>

            <form id="resetPasswordForm" style="display: none;" novalidate>

                <label for="newPassword">New Password</label>
                <input type="password" id="newPassword" placeholder="Minimum 6 characters" required autocomplete="new-password">

                <label for="confirmNewPassword">Confirm New Password</label>
                <input type="password" id="confirmNewPassword" placeholder="Re-enter new password" required autocomplete="new-password">

                <button type="submit" id="resetSubmitBtn" class="btn btn-primary">Reset Password</button>

            </form>

            <div id="resetMessage" role="status" style="display: none; margin-top: 16px; padding: 12px 14px; border-radius: 8px; font-size: 14px; text-align: left;"></div>

            <div class="auth-footer">
                <p><a href="forgot-password.html">Request a new reset link</a> • <a href="login.html">Back to Login</a></p>
            </div>

        </div>
    </main>

    <!-- Footer -->
    <footer>
        <div class="footer-bottom">
            <p>© 2026 TechSphere. All Rights Reserved.</p>
            <p>Empowering Tech Creators Worldwide</p>
        </div>
    </footer>

    <script src="script.js"></script>

</body>
</html>
