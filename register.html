<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account - TechSphere</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <a href="index.html" class="brand-wrapper">
            <div class="brand-icon">⚡</div>
            <h1>TechSphere</h1>
        </a>

        <button class="menu-toggle" id="menuToggle" aria-label="Toggle Navigation">☰</button>

        <nav id="navMenu">
            <a href="index.html">Home</a>
            <a href="login.html">Login</a>
            <a href="register.html" class="nav-cta">Register</a>
        </nav>
    </header>

    <main style="flex: 1; display: flex; align-items: center; justify-content: center; padding: 40px 20px;">
        <div class="login-container auth-card">

            <div class="brand-icon" style="margin: 0 auto 16px; width: 44px; height: 44px; font-size: 24px;">⚡</div>
            <h2>Join TechSphere</h2>
            <p>Start writing and sharing your technology ideas today.</p>

            <form id="registerForm">

                <label for="name">Full Name</label>
                <input type="text" id="name" placeholder="e.g. Alex Johnson" required autocomplete="name">

                <label for="regEmail">Email Address</label>
                <input type="email" id="regEmail" placeholder="name@example.com" required autocomplete="email">

                <label for="regPassword">Password</label>
                <input type="password" id="regPassword" placeholder="Create a strong password" required autocomplete="new-password">

                <label for="confirmPassword">Confirm Password</label>
                <input type="password" id="confirmPassword" placeholder="Re-enter password" required autocomplete="new-password">

                <button type="submit" class="btn btn-primary">Create TechSphere Account</button>

            </form>

            <div class="auth-footer">
                <p>Already have an account? <a href="login.html">Login here</a></p>
            </div>

        </div>
    </main>

    <!-- Footer -->
    <footer>
        <div class="footer-bottom">
            <p>© 2026 TechSphere. All Rights Reserved.</p>
            <p>Empowering Tech Creators Worldwide</p>
        </div>
    </footer>

    <script src="script.js"></script>

</body>
</html>
