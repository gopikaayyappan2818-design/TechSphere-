<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - TechSphere</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <a href="index.html" class="brand-wrapper">
            <div class="brand-icon">⚡</div>
            <h1>TechSphere</h1>
        </a>

        <button class="menu-toggle" id="menuToggle" aria-label="Toggle Navigation">☰</button>

        <nav id="navMenu">
            <a href="index.html">Home</a>
            <a href="login.html" class="nav-cta">Login</a>
            <a href="register.html">Register</a>
        </nav>
    </header>

    <main style="flex: 1; display: flex; align-items: center; justify-content: center; padding: 40px 20px;">
        <div class="login-container auth-card">

            <div class="brand-icon" style="margin: 0 auto 16px; width: 44px; height: 44px; font-size: 24px;">⚡</div>
            <h2>Welcome Back!</h2>
            <p>Enter your credentials to access your TechSphere account.</p>

            <form id="loginForm">

                <label for="email">Email Address</label>
                <input type="email" id="email" placeholder="name@example.com" required autocomplete="email">

                <label for="password">Password</label>
                <input type="password" id="password" placeholder="••••••••" required autocomplete="current-password">

                <button type="submit" class="btn btn-primary">Sign In to TechSphere</button>

            </form>

            <div class="auth-footer">
                <p>Don't have an account? <a href="register.html">Create one here</a></p>
            </div>

        </div>
    </main>

    <!-- Footer -->
    <footer>
        <div class="footer-bottom">
            <p>© 2026 TechSphere. All Rights Reserved.</p>
            <p>Empowering Tech Creators Worldwide</p>
        </div>
    </footer>

    <script src="script.js"></script>

</body>
</html>
